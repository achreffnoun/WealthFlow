<style>
        body {
            background-color: #faf8ff;
            color: #191b23;
            font-family: 'Outfit', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-background {

        input:focus {
            outline: none;
            border-color: #0058be !important;

    body {
      min-height: max(884px, 100dvh);

<body class="flex flex-col min-h-screen">
<div class="glass-background flex items-center justify-center p-margin-mobile md:p-xl">
<!-- Main Registration Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(30,41,59,0.05)] p-lg md:p-xl flex flex-col gap-lg">
<!-- Branding & Headline -->
<div class="flex flex-col items-center gap-sm text-center">
<div class="flex items-center gap-sm mb-xs">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">WealthFlow</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Créer votre compte</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Commencez votre voyage vers la liberté financière.</p>
</div>
<!-- Registration Form -->
<form action="#" class="flex flex-col gap-md">
<!-- Row: Prénom & Nom -->
<div class="flex flex-col md:flex-row gap-md">
<div class="flex-1 flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="firstname">Prénom</label>
<input class="w-full h-12 px-md border border-outline-variant rounded-lg font-body-md text-body-md bg-transparent focus:ring-0 transition-all" id="firstname" placeholder="Jean" type="text"/>
</div>
<div class="flex-1 flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="lastname">Nom</label>
<input class="w-full h-12 px-md border border-outline-variant rounded-lg font-body-md text-body-md bg-transparent focus:ring-0 transition-all" id="lastname" placeholder="Dupont" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="email">Email</label>
<input class="w-full h-12 px-md border border-outline-variant rounded-lg font-body-md text-body-md bg-transparent focus:ring-0 transition-all" id="email" placeholder="nom@exemple.com" type="email"/>
</div>
<!-- Mot de passe -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="password">Mot de passe</label>
<div class="relative">
<input class="w-full h-12 px-md border border-outline-variant rounded-lg font-body-md text-body-md bg-transparent focus:ring-0 transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-md">visibility</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="flex flex-col gap-xs mt-xs">
<div class="flex gap-xs w-full h-1 rounded-full overflow-hidden bg-surface-variant">
<div class="h-full w-1/3 bg-error transition-all duration-300" id="strength-bar-1"></div>
<div class="h-full w-1/3 bg-surface-variant transition-all duration-300" id="strength-bar-2"></div>
<div class="h-full w-1/3 bg-surface-variant transition-all duration-300" id="strength-bar-3"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant italic">Sécurité : Faible</span>
</div>
</div>
<!-- Confirmer mot de passe -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="confirm-password">Confirmer mot de passe</label>
<input class="w-full h-12 px-md border border-outline-variant rounded-lg font-body-md text-body-md bg-transparent focus:ring-0 transition-all" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start gap-sm mt-xs">
<input class="mt-1 w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 transition-all" id="terms" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="terms">
                        J'accepte les <a class="text-primary font-semibold hover:underline" href="#">conditions d'utilisation</a> et la politique de confidentialité.
                    </label>
</div>
<!-- Primary Button -->
<button class="w-full h-14 bg-primary text-on-primary font-body-lg text-body-lg font-semibold rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-md" type="submit">
                    Créer un compte
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md">
<div class="h-px flex-1 bg-outline-variant opacity-30"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">OU</span>
<div class="h-px flex-1 bg-outline-variant opacity-30"></div>
</div>
<!-- Social Registration Mockup -->
<div class="flex flex-col gap-sm">
<button class="w-full h-12 bg-surface-container border border-outline-variant rounded-lg flex items-center justify-center gap-md hover:bg-surface-variant transition-colors group">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-body-md text-body-md font-medium">S'inscrire avec Google</span>
</button>
</div>
<!-- Footer -->
<div class="flex justify-center mt-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Déjà un compte ? 
                    <a class="text-primary font-bold hover:underline ml-xs transition-all" href="#">Se connecter</a>
</p>
</div>
</div>
</div>
<!-- Background Decoration -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary-fixed opacity-10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary opacity-10 blur-[120px] rounded-full"></div>
</div>
<script>
        // Micro-interaction for password strength simulation
        const passwordInput = document.getElementById('password');
        const bars = [
            document.getElementById('strength-bar-1'),
            document.getElementById('strength-bar-2'),
            document.getElementById('strength-bar-3')
        ];
        const strengthLabel = document.querySelector('.italic');

        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            const length = val.length;

            // Reset
            bars.forEach(bar => {
                bar.className = 'h-full w-1/3 transition-all duration-300 bg-surface-variant';
            });

            if (length === 0) {
                strengthLabel.textContent = 'Sécurité : Aucune';
                strengthLabel.className = 'font-label-sm text-label-sm text-on-surface-variant italic';
            } else if (length < 6) {
                bars[0].className = 'h-full w-1/3 transition-all duration-300 bg-error';
                strengthLabel.textContent = 'Sécurité : Faible';
                strengthLabel.className = 'font-label-sm text-label-sm text-error italic';
            } else if (length < 10) {
                bars[0].className = 'h-full w-1/3 transition-all duration-300 bg-secondary-fixed-dim';
                bars[1].className = 'h-full w-1/3 transition-all duration-300 bg-secondary-fixed-dim';
                strengthLabel.textContent = 'Sécurité : Moyenne';
                strengthLabel.className = 'font-label-sm text-label-sm text-on-secondary-container italic';
            } else {
                bars[0].className = 'h-full w-1/3 transition-all duration-300 bg-on-secondary-container';
                bars[1].className = 'h-full w-1/3 transition-all duration-300 bg-on-secondary-container';
                bars[2].className = 'h-full w-1/3 transition-all duration-300 bg-on-secondary-container';
                strengthLabel.textContent = 'Sécurité : Forte';
                strengthLabel.className = 'font-label-sm text-label-sm text-on-secondary-container font-semibold italic';
            }
        });

        // Form submission animation mock
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            btn.classList.add('opacity-80');
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-80');
                btn.disabled = false;
                alert('Bienvenue sur WealthFlow ! Redirection vers le tableau de bord...');
            }, 1500);
        });
    </script>
</body></html>
