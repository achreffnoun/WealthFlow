<body class="bg-background dark:bg-on-background text-on-surface dark:text-inverse-on-surface min-h-screen flex flex-col font-body-md text-body-md transition-colors duration-300">

</div>
<!-- Main Content Wrapper -->
<main class="relative z-10 flex-grow flex items-center justify-center p-margin-mobile">
<div class="w-full max-w-md">
<!-- Branding Header -->
<div class="flex flex-col items-center mb-xl">
<div class="w-14 h-14 bg-primary rounded-xl flex items-center justify-center shadow-lg mb-md transform transition-transform hover:scale-105 active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed-dim tracking-tight">WealthFlow</h1>
</div>
<!-- Login Card -->
<div class="glass-card rounded-xl shadow-[0px_4px_12px_rgba(30,41,59,0.05)] border border-outline-variant/30 dark:border-outline/20 p-lg md:p-xl transition-all">
<header class="text-center mb-lg">
<h2 class="font-title-md text-title-md text-on-surface dark:text-surface-bright mb-xs">Bon retour</h2>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant">Connectez-vous pour gérer vos finances</p>
</header>
<form class="space-y-md" id="loginForm" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant ml-1" for="email">Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="w-full pl-xl pr-md py-3 bg-surface-container-low dark:bg-surface-variant/10 border border-outline-variant dark:border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-lg text-body-lg placeholder:text-outline/50" id="email" name="email" placeholder="exemple@wealthflow.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-on-surface-variant dark:text-outline-variant" for="password">Mot de passe</label>
<a class="font-label-sm text-label-sm text-primary dark:text-inverse-primary hover:underline transition-all" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative group" x-data="{ show: false }">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="w-full pl-xl pr-[48px] py-3 bg-surface-container-low dark:bg-surface-variant/10 border border-outline-variant dark:border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-lg text-body-lg placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface dark:hover:text-surface-bright transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordToggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full mt-lg py-3.5 px-lg bg-primary text-on-primary rounded-lg font-title-md text-title-md shadow-md hover:bg-primary-container hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
<span>Se connecter</span>
<span class="material-symbols-outlined text-xl">login</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-lg">
<div class="flex-grow h-px bg-outline-variant/50 dark:bg-outline/20"></div>
<span class="px-md font-label-sm text-label-sm text-outline dark:text-outline-variant">ou</span>

<span class="hidden sm:inline">Google</span>
</button>
<button class="flex items-center justify-center gap-sm py-2.5 px-md border border-outline-variant dark:border-outline/30 rounded-lg font-body-md text-body-md hover:bg-surface-container dark:hover:bg-surface-variant/20 transition-all active:scale-95">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">file_download</span>

<!-- Theme Toggle (Fixed Corner) -->
<button class="fixed top-md right-md z-50 p-sm bg-surface-container-high dark:bg-surface-variant rounded-full shadow-md text-on-surface-variant dark:text-on-surface active:scale-90 transition-all" onclick="toggleTheme()">
<span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
</button>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('passwordToggleIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.innerText = 'dark_mode';
            } else {
                html.classList.add('dark');
                icon.innerText = 'light_mode';
            }
        }

        // Form submission micro-interaction
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span><span>Connexion...</span>`;
            
            // Mock delay
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                alert('Cette démo n\'est pas connectée à un backend.');
            }, 1500);
        });
    </script>
