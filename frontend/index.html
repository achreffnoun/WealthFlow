<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WealthFlow - Suivi des Dépenses</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var theme = localStorage.getItem('suivi-depenses:theme')
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (theme === 'dark') document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body class="bg-background text-on-background font-body-md">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
